services:
  - type: web
    name: ocean-shield
    runtime: python
    buildCommand: pip install --no-cache-dir torch --extra-index-url https://download.pytorch.org/whl/cpu && pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT --workers 1 --timeout-keep-alive 120 --limit-concurrency 5
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # ⚠️ IMPORTANT: Set this to your actual Render URL after first deploy!
      # Example: https://ocean-shield.onrender.com
      # Without this, the keep-alive self-pinger will NOT work and
      # the app will sleep after 15 minutes of inactivity.
      - key: RENDER_EXTERNAL_URL
        value: ""
      # Reduce PyTorch thread pool overhead (saves ~50 MB RAM)
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
